<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Rigzer</title>
    <link rel="icon" href="resources/Logo.png" type="image/png">

    <link rel="stylesheet" href="styles/standard.css" id="style">
    <script type="module" src="styles/index.js"></script>
    <script src="app-config.js"></script>
    <script type="module" src="index.js" defer></script>

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Moonlight Web for game streaming with your pc" />
    <link rel="manifest" href="manifest.json">

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Moonlight Web">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        /* ── CSS Reset for Precision ── */
        *, *::before, *::after {
            box-sizing: border-box;
        }

        /* ── Base Container ── */
        .sc-container {
            position: fixed;
            inset: 0;
            background-color: #050505;
            overflow: hidden;
            z-index: 9999;
        }

        /* ── Overlays ── */
        .sc-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .sc-noise {
            position: absolute;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            opacity: 0.025;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-size: 128px 128px;
        }

        .sc-vignette {
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            background: radial-gradient(ellipse 90% 90% at 50% 50%, transparent 30%, rgba(0, 0, 0, 0.85) 100%);
        }

        /* ── Blink Indicators ── */
        .sc-corner-tl {
            position: absolute;
            top: 28px;
            left: 32px;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .sc-corner-br {
            position: absolute;
            bottom: 28px;
            right: 32px;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .sc-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background-color: #62D4AE;
        }

        /* ── Center Stage ── */
        .sc-main {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Bulletproof Centering for absolute rings */
        .sc-rings-container {
            position: absolute;
            inset: 0; 
            pointer-events: none;
        }

        .sc-ring {
            position: absolute;
            /* Mathematically locked to center */
            top: 50%;
            left: 50%;
            width: 280px;
            height: 280px;
            margin-top: -140px; /* Offset exactly half the height */
            margin-left: -140px; /* Offset exactly half the width */
            border-radius: 64px;
            will-change: transform, opacity;
        }
        
        .sc-ring-1 { border: 1px solid rgba(98, 212, 174, 0.3); }
        .sc-ring-2 { border: 1px solid rgba(98, 212, 174, 0.2); }
        .sc-ring-3 { border: 1px solid rgba(98, 212, 174, 0.15); }

        .sc-logo-container {
            position: relative;
            width: 200px;
            height: 200px;
        }

        .sc-glow-halo {
            position: absolute;
            inset: -40px;
            border-radius: 60px;
            pointer-events: none;
            background: radial-gradient(circle, rgba(98, 212, 174, 0.18) 0%, transparent 70%);
        }

        .sc-arc-spinner-1 {
            position: absolute;
            inset: -18px;
            border-radius: 60px;
            pointer-events: none;
            border: 1.5px solid transparent;
            border-top-color: rgba(98, 212, 174, 0.7);
            border-right-color: rgba(98, 212, 174, 0.15);
            border-bottom-color: transparent;
            border-left-color: rgba(98, 212, 174, 0.08);
        }

        .sc-arc-spinner-2 {
            position: absolute;
            inset: -28px;
            border-radius: 68px;
            pointer-events: none;
            border: 1px solid transparent;
            border-bottom-color: rgba(98, 212, 174, 0.35);
            border-left-color: rgba(98, 212, 174, 0.08);
            animation: arcSpin 5s linear infinite reverse;
        }

        .sc-logo {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 48px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
        }

        .sc-scan-container {
            position: absolute;
            inset: 0;
            z-index: 11;
            border-radius: 48px;
            overflow: hidden;
            pointer-events: none;
        }

        .sc-scan-line {
            position: absolute;
            left: 0;
            right: 0;
            height: 1.5px;
            background: linear-gradient(90deg, transparent, rgba(98, 212, 174, 0.55), transparent);
        }

        /* ── Animations ── */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes logoBreath {
            0%, 100% { transform: scale(1); box-shadow: 0 0 40px rgba(98, 212, 174, 0.10); }
            50% { transform: scale(1.024); box-shadow: 0 0 90px rgba(98, 212, 174, 0.22); }
        }

        @keyframes signalRing {
            0% { transform: scale(0.72); opacity: 0.55; }
            80% { opacity: 0.08; }
            100% { transform: scale(2.1); opacity: 0; }
        }

        @keyframes blinkDot {
            0%, 100% { opacity: 0.12; }
            50% { opacity: 0.55; }
        }

        @keyframes arcSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes scanSweep {
            0% { top: -2px; opacity: 0; }
            4% { opacity: 0.4; }
            95% { opacity: 0.18; }
            100% { top: 100%; opacity: 0; }
        }

        @keyframes glowBreath {
            0%, 100% { opacity: 0.9; }
            50% { opacity: 0.45; }
        }

        .sc-fadein { animation: fadeIn 1.1s ease forwards; }
        .sc-logo-breath { animation: logoBreath 4s ease-in-out infinite; }
        .sc-glow-breath { animation: glowBreath 4s ease-in-out infinite; }
        .sc-arc { animation: arcSpin 2.8s linear infinite; }
        .sc-scan { animation: scanSweep 3.5s linear infinite; }
        .sc-blink-1 { animation: blinkDot 2.2s ease-in-out infinite; }
        .sc-blink-2 { animation: blinkDot 2.2s ease-in-out infinite; animation-delay: 0.55s; }
        .sc-blink-3 { animation: blinkDot 2.2s ease-in-out infinite; animation-delay: 1.1s; }

        .sc-ring-1 { animation: signalRing 3s ease-out infinite; animation-delay: 0s; }
        .sc-ring-2 { animation: signalRing 3s ease-out infinite; animation-delay: 1s; }
        .sc-ring-3 { animation: signalRing 3s ease-out infinite; animation-delay: 2s; }
    </style>
</head>

<body>

    <div id="splash-screen" class="sc-container sc-fadein">
        <canvas id="sc-canvas" class="sc-canvas"></canvas>

        <div class="sc-noise"></div>

        <div class="sc-vignette"></div>

        <div class="sc-corner-tl">
            <div class="sc-dot sc-blink-1"></div>
            <div class="sc-dot sc-blink-2"></div>
            <div class="sc-dot sc-blink-3"></div>
        </div>
        <div class="sc-corner-br">
            <div class="sc-dot sc-blink-3"></div>
            <div class="sc-dot sc-blink-2"></div>
            <div class="sc-dot sc-blink-1"></div>
        </div>

        <main class="sc-main">
            <div class="sc-rings-container">
                <div class="sc-ring sc-ring-1"></div>
                <div class="sc-ring sc-ring-2"></div>
                <div class="sc-ring sc-ring-3"></div>
            </div>

            <div class="sc-logo-container">
                <div class="sc-glow-halo sc-glow-breath"></div>
                <div class="sc-arc-spinner-1 sc-arc"></div>
                <div class="sc-arc-spinner-2"></div>
                
                <img src="resources/Logo.png" alt="Rigzer" class="sc-logo sc-logo-breath" />
                
                <div class="sc-scan-container">
                    <div class="sc-scan-line sc-scan"></div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Canvas Particle Logic for Splash Screen
        (function() {
            const canvas = document.getElementById('sc-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            if (!ctx) return;

            let W = 0, H = 0, driftT = 0, animId;
            let particles = [];

            function resize() {
                W = canvas.width = window.innerWidth;
                H = canvas.height = window.innerHeight;
            }

            function initParticles() {
                particles = [];
                const count = Math.min(55, Math.floor((W * H) / 20000));
                for (let i = 0; i < count; i++) {
                    particles.push({
                        x: Math.random() * W,
                        y: Math.random() * H,
                        r: Math.random() * 1.2 + 0.2,
                        opacity: Math.random() * 0.18 + 0.03,
                        vx: (Math.random() - 0.5) * 0.09,
                        vy: (Math.random() - 0.5) * 0.07,
                        flicker: Math.random() * Math.PI * 2,
                        flickerSpeed: 0.006 + Math.random() * 0.016,
                    });
                }
            }

            function draw() {
                ctx.clearRect(0, 0, W, H);
                const ox = Math.sin(driftT * 0.0006) * 60;
                const oy = Math.cos(driftT * 0.0005) * 40;

                const g1 = ctx.createRadialGradient(W * 0.5 + ox, H * 0.46 + oy, 0, W * 0.5 + ox, H * 0.46 + oy, Math.max(W, H) * 0.65);
                g1.addColorStop(0, 'rgba(36,73,62,0.30)');
                g1.addColorStop(0.5, 'rgba(20,45,40,0.10)');
                g1.addColorStop(1, 'transparent');
                ctx.fillStyle = g1; ctx.fillRect(0, 0, W, H);

                const g2 = ctx.createRadialGradient(W, H, 0, W, H, W * 0.55);
                g2.addColorStop(0, 'rgba(98,212,174,0.04)');
                g2.addColorStop(1, 'transparent');
                ctx.fillStyle = g2; ctx.fillRect(0, 0, W, H);

                const g3 = ctx.createRadialGradient(0, 0, 0, 0, 0, W * 0.38);
                g3.addColorStop(0, 'rgba(36,73,62,0.10)');
                g3.addColorStop(1, 'transparent');
                ctx.fillStyle = g3; ctx.fillRect(0, 0, W, H);

                particles.forEach(p => {
                    p.flicker += p.flickerSpeed;
                    const a = p.opacity * (0.6 + 0.4 * Math.sin(p.flicker));
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(98,212,174,${a.toFixed(3)})`;
                    ctx.fill();
                    p.x += p.vx; p.y += p.vy;
                    if (p.x < -4) p.x = W + 4; if (p.x > W + 4) p.x = -4;
                    if (p.y < -4) p.y = H + 4; if (p.y > H + 4) p.y = -4;
                });

                driftT++;
                animId = requestAnimationFrame(draw);
            }

            function onResize() {
                resize();
                initParticles();
            }

            window.addEventListener('resize', onResize);
            resize();
            initParticles();
            draw();
            
            // To properly cleanup if the splash screen is removed by your main app
            window.cleanupSplashScreen = function() {
                window.removeEventListener('resize', onResize);
                cancelAnimationFrame(animId);
            };
        })();
    </script>

    <div id="modal-overlay" class="modal-background modal-disabled">
        <div id="modal-parent" class="modal-content">
        </div>
    </div>

    <div id="context-menu" class="context-menu-background context-menu-disabled">
    </div>

    <div id="error-list">
    </div>

    <div id="root">
    </div>

</body>

</html>
